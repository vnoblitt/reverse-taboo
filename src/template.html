<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Taboo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Ultra&display=swap" rel="stylesheet">
</head>
<body> 
    <nav>
        <ul>
            <li class="title">REVERSE TABOO</li>
            <li id="rules" class="rules">Rules</li>
            <li id="date"></li>
            <li id="dark-mode" class="dark-mode">Dark Mode</li>
        </ul>
    </nav>
    

    <dialog id="explain">
        <h2>How it works:</h2>
        <p>You start with a one word clue related to the answer. 
            Try to guess what the secret word is.</p>
        <p>Each time you guess wrong another clue is revealed.</p>
        <p>You have 5 guesses in total.</p>
        <button id="close-rules">Close</button>
    </dialog>

    <div id="content">
        <span id="clues">Clues: </span>

        <div id="guess">
            <input id="guess-input"/>
            <button id="guess-button">Guess</button>
        </div>
        
        <span id="previous-guesses">Guessed: </span>
    </div>
</body>
</html>
